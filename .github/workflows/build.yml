name: Build and release Diamond Says
on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang lld make gcc zip unzip file
      - name: Test and build
        run: make check && make
      - name: Verify ZIP
        run: |
          unzip -t dist/q2-diamond-says.zip
          unzip -p dist/q2-diamond-says.zip .diamond-says/q2app | grep -Fx 'game=1'
          file dist/.diamond-says/q2-diamond-says | grep -E 'ELF 32-bit LSB.*MIPS'
      - uses: actions/upload-artifact@v6
        with:
          name: q2-diamond-says-card-app
          path: dist/q2-diamond-says.zip
          if-no-files-found: error
  latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: q2-diamond-says-card-app
          path: dist
      - name: Publish easy-install latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/q2-diamond-says.zip --clobber
          else
            gh release create latest dist/q2-diamond-says.zip \
              --target "$GITHUB_SHA" --title 'Diamond Says - Latest Build' \
              --notes 'Install: extract q2-diamond-says.zip to the root of your Q2 microSD card, not the GitHub source-code ZIP.'
          fi
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: q2-diamond-says-card-app
          path: dist
      - name: Publish ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/q2-diamond-says.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/q2-diamond-says.zip --verify-tag --generate-notes
          fi
